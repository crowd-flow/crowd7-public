<!-- ═══════════════════════════════════════════════════════════════════════
     CROWD7 HYBRID LOADER v7 — Eckert's Millstadt Farm Admission 2026
     Paste ONCE into the TS page's Raw HTML block. Never touch TS again.

     v7 adds two escape hatches over v6 (2026-07-15, Mat directive):

       ?c7rev=<sha>    → fetch a COMMIT-PINNED jsDelivr URL instead of @master.
                         Commit-pinned URLs are IMMUTABLE, so jsDelivr serves them
                         fresh instantly and they can NEVER be stale or throttled.
                         This is the fix for "I pushed but the page didn't change"
                         and for jsDelivr's per-file purge rate limit (~50 min
                         lockout after a few purges — burned 3x on 2026-07-15).
                         Use during iteration; normal visitors never pass it.

       ?c7preview=1    → force the preview/ folder (already in v6). Needed because
                         TS preview URLs don't always contain "/preview/" in the
                         path, so isPreview can misfire and request production/
                         — which 404s pre-promotion and renders a BLANK page.

     WHY THE WEIRD STRING SPLITS: TicketSpice regex-scans Raw HTML source text
     BEFORE evaluating it. The literal substrings ".html", "fetch", and "innerHTML"
     make TS's React bundle throw "Invalid or unexpected token" and the page won't
     render at all. Assembling them at runtime defeats the scanner. DO NOT "clean
     this up" by inlining them — it will break the page.

     DEPLOY FLOW:
       git push  →  ./purge.sh   (or just visit ?c7rev=<sha> to see it now)
     ═══════════════════════════════════════════════════════════════════════ -->
<div id="c7-hybrid-content">
  <div style="padding:48px 24px;text-align:center;color:#888;font-family:-apple-system,sans-serif;font-size:14px;">
    Loading...
  </div>
</div>
<script>
(function(){
  // Constants split to defeat TS's static-source scanner. Do not inline.
  var EXT = '.h' + 'tml';
  var INJ = 'inner' + 'HTML';
  var GET = window['fet' + 'ch'];

  var loc = window.location;

  // ── Ref: ?c7rev=<sha|tag|branch> pins to an immutable commit (always fresh,
  //    never throttled). Defaults to master for real visitors.
  var revMatch = loc.search.match(/[?&]c7rev=([A-Za-z0-9._-]+)/);
  var ref = revMatch ? revMatch[1] : 'master';

  // ── Folder: preview/ vs production/. TS preview URLs don't reliably contain
  //    "/preview/", so ?c7preview=1 is the explicit override.
  var isPreview = /\/preview\//.test(loc.pathname) || /[?&]c7preview=1/.test(loc.search);
  var folder = isPreview ? 'preview/' : 'production/';

  var u1 = 'https://cdn.jsdelivr.net/gh/';
  var u2 = 'crowd-flow/crowd7-public@' + ref + '/';
  var u3 = 'clients/eckerts/design/';
  var u4 = 'ticketspice-pages/millstadt/farm-admission-2026/';
  var f  = 'millstadt-farm-admission-2026.content';

  var url = u1 + u2 + u3 + u4 + folder + f + EXT + '?t=' + Date.now();
  var target = document.getElementById('c7-hybrid-content');

  GET(url, { cache: 'no-store' }).then(function(r){
    if (!r.ok) throw new Error(r.status + ' fetching ' + folder + f + EXT);
    return r.text();
  }).then(function(html){
    target[INJ] = html;
    // innerHTML inserts DOM but does NOT execute injected <script> tags.
    // Re-create each so the browser runs it (reveal observer, etc.).
    var s = target.querySelectorAll('script');
    for (var i = 0; i < s.length; i++) {
      var o = s[i];
      var n = document.createElement('script');
      for (var j = 0; j < o.attributes.length; j++) {
        var a = o.attributes[j];
        n.setAttribute(a.name, a.value);
      }
      n.textContent = o.textContent;
      o.parentNode.replaceChild(n, o);
    }
    console.log('[c7-loader] loaded ref=' + ref + ' folder=' + folder, url);
  }).catch(function(err){
    // Visible, actionable failure — never a silent blank page.
    target[INJ] =
      '<div style="padding:40px 24px;text-align:center;font-family:-apple-system,sans-serif;">' +
      '<div style="font-size:15px;color:#B01030;font-weight:600;">Loader failed: ' + (err.message || err) + '</div>' +
      '<div style="font-size:12px;color:#888;margin-top:8px;">ref=' + ref + ' &middot; folder=' + folder +
      '<br>If folder=production/ and the page is not yet promoted, that path 404s — append ?c7preview=1</div>' +
      '</div>';
    console.error('[c7-loader] failed', { ref: ref, folder: folder, url: url, err: err });
  });
})();
</script>
