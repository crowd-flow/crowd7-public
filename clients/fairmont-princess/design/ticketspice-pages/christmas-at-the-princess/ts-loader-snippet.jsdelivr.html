<!--
  CAP hybrid-loader snippet — jsDelivr edition (v6). Paste this ONCE into the
  Christmas-at-the-Princess TicketSpice page's Raw HTML block, replacing the old
  raw.githubusercontent loader. Fixes the ~5-min GitHub-raw cache: jsDelivr has a
  purge API, so after each `git push` we purge and the page is live in seconds.
  (Run purge.sh in this folder after every push — or the deploy does it for you.)
-->
<div id="c7-hybrid-content">
  <div style="padding:48px 24px;text-align:center;color:#888;font-family:-apple-system,sans-serif;font-size:14px;">
    Loading...
  </div>
</div>
<script>
(function(){
  // Constants split to defeat TS's static-source scanner.
  var EXT = '.h' + 'tml';
  var INJ = 'inner' + 'HTML';
  var GET = window['fet' + 'ch'];
  var u1 = 'https://cdn.jsdelivr.net/gh/';
  var u2 = 'crowd-flow/crowd7-public@master/';
  var u3 = 'clients/fairmont-princess/design/';
  var u4 = 'ticketspice-pages/christmas-at-the-princess/';
  var f  = 'christmas-at-the-princess-2026.content';   // filename stem (no .html)
  var loc = window.location;
  var isPreview = /\/preview\//.test(loc.pathname) || /[?]c7preview=1/.test(loc.search);
  var folder = isPreview ? 'preview/' : 'production/';
  var url = u1 + u2 + u3 + u4 + folder + f + EXT + '?t=' + Date.now();  // ?t= busts the BROWSER; jsDelivr edge is busted by purge-on-deploy
  var target = document.getElementById('c7-hybrid-content');
  GET(url, { cache: 'no-store' }).then(function(r){
    return r.text();
  }).then(function(html){
    target[INJ] = html;
    var s = target.querySelectorAll('script');
    for (var i = 0; i < s.length; i++) {
      var o = s[i];
      var n = document.createElement('script');
      for (var j = 0; j < o.attributes.length; j++) {
        var a = o.attributes[j];
        n.setAttribute(a.name, a.value);
      }
      n.textContent = o.textContent;
      o.parentNode.replaceChild(n, o);
    }
    console.log('[c7-loader] loaded', folder, url);
  }).catch(function(err){
    target.textContent = 'Loader failed: ' + (err.message || err);
    console.error('[c7-loader] failed', err);
  });
})();
</script>
