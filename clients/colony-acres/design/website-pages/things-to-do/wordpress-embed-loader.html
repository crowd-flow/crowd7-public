<!-- ############################################################################
     ## READ THIS BEFORE PASTING - it will silently break the page otherwise.  ##
     ############################################################################
     PASTE THIS INTO A REGULAR "CODE" MODULE INSIDE A **STANDARD** SECTION.
     DO **NOT** USE A "FULLWIDTH CODE" MODULE / FULLWIDTH SECTION.

     Divi core ships this rule:
       .et_pb_fullwidth_section > .et_pb_module:not(.et_pb_post_content)
         :not(.et_pb_fullwidth_post_content) .et_pb_row { padding: 0 !important; }
     In a fullwidth section it zeroes the padding on EVERY row of the injected page
     guts. The page still renders - it just loses all its vertical spacing, with no
     error anywhere. Cost us three wrong fixes on 2026-07-29 before a headless render
     of live-vs-standalone isolated it.

     The guts carry a #ca-guts guard block that defeats this even in a fullwidth
     module, but do not rely on it - use a standard section and the guard stays
     belt-and-braces rather than load-bearing.
     ############################################################################ -->
<!-- ============================================================================
     COLONY ACRES — THINGS TO DO (FUN YARD ACTIVITIES) — WordPress/Divi Hybrid loader (the ONE editor step, ever).

     Paste this ONCE into a Divi "Code" module (or a WordPress Custom HTML block) that
     replaces the Fun Yard Activities page content. After that, every content change ships by
     `git push` to the page-guts files in this repo — no WordPress editor, ever again.

       1. ENV ROUTING — default loads production/ guts. Append ?preview=1 to the page URL
          to load preview/ guts (stage a change before promoting it live).
       2. SCRIPT REHYDRATION — innerHTML does NOT run injected <script> tags, so the loader
          re-creates each injected <script> so future interactive guts still execute.
     ============================================================================ -->
<div id="lc-colony-things-to-do" class="lc-embed"></div>
<script>
(function () {
  var TARGET = "lc-colony-things-to-do";
  var BASE = "https://raw.githubusercontent.com/crowd-flow/crowd7-public/master/clients/colony-acres/design/website-pages/things-to-do/";
  var ENV = /[?&]preview=1/.test(location.search) ? "preview" : "production";
  fetch(BASE + ENV + "/things-to-do.html", { cache: "no-store" })
    .then(function (r) { return r.text(); })
    .then(function (html) {
      var host = document.getElementById(TARGET);
      host.innerHTML = html;
      host.querySelectorAll("script").forEach(function (old) {
        var s = document.createElement("script");
        for (var i = 0; i < old.attributes.length; i++) { s.setAttribute(old.attributes[i].name, old.attributes[i].value); }
        s.textContent = old.textContent;
        old.parentNode.replaceChild(s, old);
      });
    })
    .catch(function (e) { console.error("Colony things-to-do embed load failed:", e); });
})();
</script>
