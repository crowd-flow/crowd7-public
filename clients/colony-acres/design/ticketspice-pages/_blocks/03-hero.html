<!-- =====================================================================
     03 · HERO  ·  big photo banner with the page title + tagline
     =====================================================================
     WHAT IT IS: the full-width hero image with a dark gradient overlay,
        a large title, and a handwritten-style tagline.
     WHAT TO SWAP:
        • BACKGROUND PHOTO → the hero image is set in the BASE STYLES file,
          on the ".caf-hero" rule (background-image: url('...')). Change the
          URL there to swap the hero photo.
        • TITLE → "Fun Yard <em>Admission</em>" (the <em> word renders in the
          gold script font — keep one or two words inside <em> for that look).
        • TAGLINE → "— A Little Country, in the City. —".
     DEPENDS ON: 00-base-styles.html + must sit inside 01-funnel-open.html.
     ===================================================================== -->
    <!-- HERO -->
    <div class="caf-hero">
        <div class="caf-hero-overlay"></div>
        <div class="caf-hero-content">
            <span class="caf-hero-title">Fun Yard <em>Admission</em></span>
            <span class="caf-hero-tagline">— A Little Country, in the City. —</span>
        </div>
    </div>
