<!-- =====================================================================
     FLOATING BUY-TICKETS BAR  ·  the orange button stuck to the bottom
     =====================================================================
     ⭐ PASTE THIS AS A SEPARATE BLOCK — not inside the funnel wrapper.
        In TicketSpice this goes in its OWN Custom HTML block, AFTER the
        main page block. It's fully self-contained (its own <style>, HTML,
        and <script>), so it works on any page on its own.
     WHAT IT IS: a "Buy Tickets" button pinned to the bottom of the screen
        that stays visible while scrolling and hides itself once tapped.
     WHAT TO SWAP:
        • Button label → the text inside the <a> ("Buy Tickets").
        • The button jumps to TicketSpice's native cart (#ticketBlock) —
          leave that href alone.
     DEPENDS ON: nothing. Self-contained.
     ===================================================================== -->
<style>
    #caf-float-btn {
        position: fixed !important;
        bottom: 0 !important;
        left: 0 !important;
        right: 0 !important;
        z-index: 9999 !important;
        padding: 10px 16px 14px !important;
        background: linear-gradient(to top, rgba(251,246,236,0.97) 85%, transparent) !important;
        display: flex !important;
        justify-content: center !important;
        transition: opacity 0.35s ease, transform 0.35s ease !important;
        /* let the TicketSpice Attendee Support chat widget (and anything
           else beneath) receive clicks through the transparent band */
        pointer-events: none !important;
    }
    #caf-float-btn.caf-float-hidden {
        opacity: 0 !important;
        transform: translateY(24px) !important;
        pointer-events: none !important;
    }
    #caf-float-btn.caf-float-hidden a { pointer-events: none !important; }
    #caf-float-btn a {
        display: block !important;
        width: 100% !important;
        max-width: 480px !important;
        background: #E8743C !important;
        color: #ffffff !important;
        font-family: 'Zilla Slab', 'Times New Roman', serif !important;
        font-size: 24px !important;
        font-weight: 700 !important;
        letter-spacing: 0.06em !important;
        text-align: center !important;
        text-decoration: none !important;
        padding: 20px 28px !important;
        border-radius: 50px !important;
        box-shadow: 0 8px 32px rgba(216,95,40,0.40) !important;
        transition: transform 0.15s, box-shadow 0.15s, background 0.2s !important;
        border: none !important;
        cursor: pointer !important;
        pointer-events: auto !important;
    }
    #caf-float-btn a:hover {
        background: #D85F28 !important;
        transform: translateY(-2px) !important;
        box-shadow: 0 14px 40px rgba(216,95,40,0.55) !important;
        color: #ffffff !important;
        text-decoration: none !important;
    }
</style>

<div id="caf-float-btn">
    <a href="#ticketBlock">Buy Tickets</a>
</div>

<script>
    (function() {
        var floatBtn = document.getElementById('caf-float-btn');
        // Hide on click only — TicketSpice widget loads dynamically so
        // scroll-depth detection is unreliable. Button stays visible until tapped.
        if (floatBtn) {
            floatBtn.querySelector('a').addEventListener('click', function() {
                floatBtn.classList.add('caf-float-hidden');
            });
        }
    })();
</script>
