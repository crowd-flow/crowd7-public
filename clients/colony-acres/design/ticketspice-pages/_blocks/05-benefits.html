<!-- =====================================================================
     05 · BENEFITS ROW  ·  4 quick "what's included" highlights
     =====================================================================
     WHAT IT IS: a white row of 4 short highlights (attraction name + a
        one-line description), divided by faint vertical lines.
     WHAT TO SWAP:
        • Each ".caf-benefit" block = one highlight. Change the title
          (".caf-benefit-title") and the description (".caf-benefit-desc").
        • Want fewer/more than 4? Add or delete whole ".caf-benefit" blocks.
          The base styles are set for 4 across on desktop (2 across on phones);
          3 or 5 will still work but won't divide perfectly evenly.
     DEPENDS ON: 00-base-styles.html + must sit inside 01-funnel-open.html.
     ===================================================================== -->
    <!-- BENEFITS -->
    <div class="caf-benefits">
        <div class="caf-benefits-grid">
            <div class="caf-benefit">
                <span class="caf-benefit-title">Giant Double Slide</span>
                <span class="caf-benefit-desc">Race a friend down two stories of fun</span>
            </div>
            <div class="caf-benefit">
                <span class="caf-benefit-title">Corn Maze</span>
                <span class="caf-benefit-desc">Wind through acres of tall stalks</span>
            </div>
            <div class="caf-benefit">
                <span class="caf-benefit-title">Barrel Train</span>
                <span class="caf-benefit-desc">Hop on for a ride around the farm</span>
            </div>
            <div class="caf-benefit">
                <span class="caf-benefit-title">Fall Hayride &amp; More</span>
                <span class="caf-benefit-desc">20+ activities · free parking · always</span>
            </div>
        </div>
    </div>
