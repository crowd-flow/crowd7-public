<!-- ============================================================================
     CrowdView client pop-up block  ·  v7  ·  2026-08-27

     v7 — reads `d.popup`, calls /api/live-popup. The 2026-08-19 rename
     changed the API response envelope, but the 86 blocks installed before
     this version were never re-synced: they read the old key, got undefined,
     and rendered nothing for eight days across ten accounts. Nothing
     surfaced it, because this block fails silent by design. `popup` is the
     only name for this feature, in the schema, the API and the UI — if you
     are adding a compatibility shim for an older one, don't.
     Project: crowdview-client-popups-table / page-inventory (self-identifying)

     WHAT IT DOES
     Renders a pop-up on this TicketSpice page whenever the client has one
     scheduled in CrowdView right now. The client publishes it themselves at
     https://crowd7-team-hub.vercel.app/client/popups (five fields:
     page, start, end, title, message) — Crowd7 does nothing per pop-up.

     WHY IT EXISTS
     Eckert's check-in 2026-08-12. Amanda Morgan: "there's so many things that
     I cannot change myself and I am not used to relying on somebody... I am a
     doer." Her cases are same-day and operational — a 107-degree Saturday
     means closing at 2 PM — and she works Central while Crowd7 is Pacific, so
     "ask Crowd7 and wait" is structurally too slow. Page content lives in
     crowd7-public and ships by git push, which is exactly what puts it out of
     her reach. This block is the narrow carve-out.

     INSTALL — paste at the END of the page's content HTML. THAT IS ALL.
     There are NO tokens to fill in as of v3.

     The block identifies itself: it sends its own address
     (location.origin + location.pathname) and CrowdView matches that against
     page.ts_url, which scripts/sync_ts_pages.mjs fills from the TicketSpice
     form's own publishedPath. Nobody types a slug, so nobody can mistype one.

     v1/v2 required two hand-filled tokens (C7A_ACCOUNT / C7A_PAGE) and a
     wrong value failed SILENTLY — no banner, no error, nothing to debug.
     That whole failure class is gone. Blocks already pasted with v1/v2 tokens
     keep working: the endpoint still accepts ?account=&page= (see
     edge/api-live-popup.js) and there is no rush to re-paste them.

     PREVIEW LINKS SHOW POP-UPS — deliberately (Mat, 2026-08-17). v5 is what
     actually makes that work: the block also sends the form's NAME and HOST,
     because a preview URL carries no reference to its published path (not
     even in __BOOTSTRAP__.formURL, which is the preview URL as well).
     v3 briefly suppressed rendering on TicketSpice preview URLs. That was a
     mistake and is reverted: a pop-up is live or not according to its
     SCHEDULE WINDOW, never according to which URL you view it from, so the
     guard protected nothing while removing the only way to check your own
     work before an event. Previewing a page now shows exactly what a buyer
     sees.

     SAFE BY CONSTRUCTION
     · Read-only GET to a public endpoint. No credentials sent or accepted.
     · Every field is injected via textContent, never innerHTML — a client
       cannot inject markup or script into their own live cart page.
     · Fails silent. Network error, bad JSON, missing element → no pop-up, no
       console noise for a buyer, page otherwise untouched.
     · Shows once per browser session PER POP-UP. The dedupe key is a
       hash of the content, so a NEW or EDITED pop-up re-shows to
       someone who already dismissed the previous one — which is the whole
       point when the message is "we're closing early after all."
     · Kill switch: set window.C7A_ENABLED = false before this block.
============================================================================ -->
<style>
/* OPTIONAL per-page theme — fill from the page's own palette, or delete this
   block entirely for the default neutral card. See THEME note above. */
:root {
  /* --c7a-card-bg: #fff; */
  /* --c7a-ink: #1a1d21; */
  /* --c7a-ink-dim: #3c4147; */
  /* --c7a-btn-bg: #1a1d21; */
  /* --c7a-btn-ink: #fff; */
  /* --c7a-scrim: rgba(12,14,17,.55); */
  /* --c7a-radius: 12px; */
  /* --c7a-font: inherit; */
}
</style>
<div id="c7a-root" hidden></div>
<script>
(function () {
  'use strict';
  if (window.C7A_ENABLED === false) return;
  if (window.__c7aInit) return;          // never double-init if pasted twice
  window.__c7aInit = true;

  var ENDPOINT = 'https://crowd7-team-hub.vercel.app/api/live-popup';


  // ── Self-identification ────────────────────────────────────────────────
  // Primary key is `location` (guaranteed by the browser). Query string and
  // hash are dropped — ticketing links are covered in UTM tags, and the
  // server normalizes the same way.
  var PAGE_URL = location.origin + location.pathname;

  // PREVIEW LINKS need a second key. On /preview/<hash> the path is the hash,
  // and __BOOTSTRAP__.formURL is the preview URL TOO — nothing on the page
  // carries its published path, so URL matching cannot work there. formName
  // is stable across published and preview renders and is the exact string
  // CrowdView stores as page.name (same TicketSpice API field), so it is the
  // fallback. Host scopes it so two clients' similarly-named forms can't
  // collide. Read defensively: __BOOTSTRAP__ is internal Webconnex structure.
  // LEGACY FALLBACK. Some pages can be matched by neither URL nor name:
  // Montpelier's forms, for instance, are 'open' but were never PUBLISHED, so
  // TicketSpice returns no publishedPath and CrowdView has no ts_url to match
  // against. Those pages still have working account/page slugs, so the sync
  // script PRESERVES these two values (like it preserves the theme) and the
  // block sends them as a last resort. Empty on a page that doesn't need them.
  var C7A_ACCOUNT = '';
  var C7A_PAGE    = '';

  var FORM_NAME = '', TS_HOST = '';
  try {
    var b = window.__BOOTSTRAP__;
    var s = b && b.appSettings;
    if (typeof s === 'string') s = JSON.parse(s);
    if (s) { FORM_NAME = s.formName || ''; TS_HOST = s.host || ''; }
  } catch (e) { /* fall back to URL-only matching */ }

  // Small, stable string hash (djb2) — only used as a sessionStorage dedupe
  // key, never for anything security-relevant.
  function hash(s) {
    var h = 5381, i = s.length;
    while (i) h = (h * 33) ^ s.charCodeAt(--i);
    return (h >>> 0).toString(36);
  }

  function seen(key) {
    try { return sessionStorage.getItem('c7a_' + key) === '1'; } catch (e) { return false; }
  }
  function markSeen(key) {
    try { sessionStorage.setItem('c7a_' + key, '1'); } catch (e) { /* private mode */ }
  }

  function render(a) {
    var key = hash(a.title + ' ' + a.message);
    if (seen(key)) return;

    var style = document.createElement('style');
    style.textContent = [
      '#c7a-ov{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;',
      'justify-content:center;padding:20px;background:var(--c7a-scrim,rgba(12,14,17,.55));',
      '-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);',
      'opacity:0;transition:opacity .18s ease;}',
      '#c7a-ov.c7a-in{opacity:1;}',
      '#c7a-card{position:relative;background:var(--c7a-card-bg,#fff);color:var(--c7a-ink,#1a1d21);',
      'border-radius:var(--c7a-radius,12px);',
      'padding:24px 26px 20px;max-width:400px;width:100%;text-align:center;',
      'box-shadow:0 14px 44px rgba(0,0,0,.3);',
      'font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;',
      'transform:translateY(8px) scale(.98);transition:transform .18s ease;}',
      '#c7a-ov.c7a-in #c7a-card{transform:none;}',
      '#c7a-x{position:absolute;top:6px;right:10px;background:none;border:0;font-size:22px;',
      'line-height:1;color:var(--c7a-ink-dim,#9aa0a6);cursor:pointer;padding:4px 6px;}',
      '#c7a-x:hover{color:var(--c7a-ink,#5f666e);}',
      '#c7a-t{font-size:27px;font-weight:650;letter-spacing:-.01em;margin:0 0 9px;',
      'overflow-wrap:anywhere;font-family:var(--c7a-font,inherit);}',
      '#c7a-m{font-size:14.5px;line-height:1.55;color:var(--c7a-ink-dim,#3c4147);margin:0 0 18px;',
      'white-space:pre-wrap;overflow-wrap:anywhere;}',
      '#c7a-ok{background:var(--c7a-btn-bg,#1a1d21);color:var(--c7a-btn-ink,#fff);border:0;',
      'border-radius:8px;padding:10px 24px;',
      'font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}',
      '#c7a-ok:hover{filter:brightness(1.15);}',
      '@media (prefers-reduced-motion:reduce){#c7a-ov,#c7a-card{transition:none;}}'
    ].join('');

    var ov = document.createElement('div');
    ov.id = 'c7a-ov';
    ov.setAttribute('role', 'dialog');
    ov.setAttribute('aria-modal', 'true');
    ov.setAttribute('aria-labelledby', 'c7a-t');

    var card = document.createElement('div');
    card.id = 'c7a-card';

    var x = document.createElement('button');
    x.id = 'c7a-x'; x.type = 'button';
    x.setAttribute('aria-label', 'Close');
    x.textContent = '×';

    var h = document.createElement('h2');
    h.id = 'c7a-t';
    h.textContent = a.title;               // textContent, never innerHTML

    var p = document.createElement('p');
    p.id = 'c7a-m';
    p.textContent = a.message;             // textContent, never innerHTML

    var ok = document.createElement('button');
    ok.id = 'c7a-ok'; ok.type = 'button';
    ok.textContent = 'Got it';

    card.appendChild(x); card.appendChild(h); card.appendChild(p); card.appendChild(ok);
    ov.appendChild(card);
    document.head.appendChild(style);
    document.body.appendChild(ov);
    requestAnimationFrame(function () { ov.classList.add('c7a-in'); });

    function close() {
      markSeen(key);
      ov.classList.remove('c7a-in');
      setTimeout(function () { if (ov.parentNode) ov.parentNode.removeChild(ov); }, 200);
      document.removeEventListener('keydown', onKey);
    }
    function onKey(e) { if (e.key === 'Escape' || e.key === 'Esc') close(); }

    x.addEventListener('click', close);
    ok.addEventListener('click', close);
    ov.addEventListener('click', function (e) { if (e.target === ov) close(); });
    document.addEventListener('keydown', onKey);
    ok.focus();
  }

  function go() {
    var url = ENDPOINT + '?url=' + encodeURIComponent(PAGE_URL);
    if (FORM_NAME) url += '&name=' + encodeURIComponent(FORM_NAME);
    if (TS_HOST)   url += '&host=' + encodeURIComponent(TS_HOST);
    if (C7A_ACCOUNT && C7A_PAGE) {
      url += '&account=' + encodeURIComponent(C7A_ACCOUNT)
           + '&page='    + encodeURIComponent(C7A_PAGE);
    }
    // No credentials — the endpoint is public and must stay that way for the
    // CORS wildcard to be valid.
    fetch(url, { credentials: 'omit', mode: 'cors' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (d && d.popup && d.popup.title && d.popup.message) {
          render(d.popup);
        }
      })
      .catch(function () { /* fail silent — see SAFE BY CONSTRUCTION */ });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', go);
  } else {
    go();
  }
})();
</script>
<!-- =================== END CrowdView pop-up block =================== -->
